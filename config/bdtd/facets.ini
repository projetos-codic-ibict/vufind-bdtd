; BDTD: somente o que difere do facets.ini padrão do VuFind 11.
[Parent_Config]
relative_path = ../vufind/facets.ini
; A lista de facetas dos resultados e as faixas de datas substituem as do padrão
override_full_sections = "Results,SpecialFacets"

[Results]
; Facetas da produção, na mesma ordem
instname_str                      = Institution
network_name_str                  = Source
dc.publisher.program.fl_str_mv    = Program
author_facet                      = Author
dc.contributor.advisor1.fl_str_mv = Advisor
format                            = Format
eu_rights_str_mv                  = "Access type"
language                          = Language
dc.subject.por.fl_str_mv          = Subject
dc.subject.eng.fl_str_mv          = "English Subject"
dc.subject.cnpq.fl_str_mv         = "CNPq Subject"
publishDate                       = adv_search_year

[Results_Settings]
; Todas as instituições na faceta; todas começam recolhidas, exceto tipo de acesso e ano
facet_limit_by_field[instname_str] = -1
collapsedFacets = "instname_str,network_name_str,dc.publisher.program.fl_str_mv,author_facet,dc.contributor.advisor1.fl_str_mv,format,language,dc.subject.por.fl_str_mv,dc.subject.eng.fl_str_mv,dc.subject.cnpq.fl_str_mv"

[SpecialFacets]
; Só o ano (publishDate), como na produção: o publishDateRange do padrão não existe nos dados
dateRange[] = publishDate

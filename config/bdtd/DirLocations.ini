; BDTD: configuração própria da BDTD, versionada e sem segredos.
;
; Esta pasta funciona como um diretório local do VuFind: os arquivos daqui
; sobrepõem os de config/vufind (cada um herda o padrão por [Parent_Config]) e
; as traduções de languages/ sobrepõem as do VuFind.
;
; A instalação aponta para ela a partir do seu diretório local (VUFIND_LOCAL_DIR),
; que guarda o que é de cada servidor (banco, chaves) e fica fora do git. No
; DirLocations.ini desse diretório local:
;
;   [Parent_Dir]
;   path = /caminho/do/vufind/config/bdtd
;   is_relative_path = false
;
; Os arquivos de configuração ficam direto nesta pasta, não em config/vufind:
[Local_Dir]
config_subdir = "."

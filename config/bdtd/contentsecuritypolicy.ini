; BDTD: somente o que difere do contentsecuritypolicy.ini padrão do VuFind 11.
[Parent_Config]
relative_path = ../vufind/contentsecuritypolicy.ini
; As diretivas substituem as do padrão (lista completa abaixo)
override_full_sections = "Directives"

; O modo continua "report_only" (padrão do VuFind 11): o navegador só avisa das violações.
; Passar a bloquear (enabled[production] = true) é decisão do go-live, depois de conferir
; o VLibras aberto e a tradução de página com a política abaixo.

[Directives]
; Padrão do VuFind 11 com os serviços da BDTD: barra do Governo Federal, VLibras, Google
; Tradutor, UserWay, reCAPTCHA, Google Analytics e Matomo da LA Referencia.
default-src[] = "'self'"

; Janelas internas: a própria página (VLibras), o painel do UserWay e o reCAPTCHA
child-src[] = "'self'"
frame-src[] = "'self'"
frame-src[] = "https://cdn.userway.org"
frame-src[] = "https://www.google.com"
frame-src[] = "https://www.recaptcha.net"

object-src[] = "'none'"

script-src[] = "http:"
script-src[] = "https:"

connect-src[] = "'self'"
connect-src[] = "https://api.userway.org"
connect-src[] = "https://translate.googleapis.com"
connect-src[] = "https://translate-pa.googleapis.com"
connect-src[] = "https://vlibras.gov.br"
connect-src[] = "https://*.vlibras.gov.br"
connect-src[] = "https://*.google-analytics.com"
connect-src[] = "https://*.analytics.google.com"
connect-src[] = "https://*.googletagmanager.com"
connect-src[] = "https://matomo.lareferencia.info"

worker-src[] = "blob:"

style-src[] = "'self'"
style-src[] = "'unsafe-inline'"
style-src[] = "https://cdn.userway.org"
style-src[] = "https://www.gstatic.com"

img-src[] = "'self'"
; ícones em SVG embutido da barra do Governo Federal
img-src[] = "data:"
img-src[] = "https://cdn.userway.org"
img-src[] = "https://vlibras.gov.br"
img-src[] = "https://www.gstatic.com"
img-src[] = "https://fonts.gstatic.com"
img-src[] = "https://translate.googleapis.com"
img-src[] = "https://translate.google.com"
img-src[] = "https://www.google.com"
img-src[] = "https://*.google-analytics.com"
img-src[] = "https://www.googletagmanager.com"
img-src[] = "https://matomo.lareferencia.info"

font-src[] = "'self'"
; a barra do Governo Federal carrega a fonte no mesmo protocolo da página
font-src[] = "barra.brasil.gov.br"
font-src[] = "https://cdn.userway.org"
font-src[] = "https://fonts.gstatic.com"

base-uri[] = "'self'"

; BDTD: somente o que difere do config.ini padrão do VuFind 11.
; O restante vem do arquivo pai (config/vufind/config.ini) via [Parent_Config].
; Senhas e chaves não entram aqui: ficam na camada local do servidor.
[Parent_Config]
relative_path = ../vufind/config.ini
override_full_sections = "Languages"

[Site]
; Identidade e idioma padrão da BDTD (valores da produção; fuso corrigido)
email           = bdtd@ibict.br
title           = "Biblioteca Digital Brasileira de Teses e Dissertações (BDTD)"
theme           = bdtd
language        = pt-br
locale          = pt_BR
timezone        = "America/Sao_Paulo"
sidebarOnLeft   = true

[BdtdTheme]
; Barra do Governo Federal no topo das páginas (script de barra.brasil.gov.br)
gov_bar = true
; Serviços de terceiros da produção: botão do Google Tradutor, widget de acessibilidade
; UserWay (conta) e verificação do site no Google Search Console
google_translate         = true
userway_account          = "gxYK4Xrqhn"
google_site_verification = "O4MlrfmxB744id4GdcKmv79sPQNLIjWzEB_VV9o1byw"

[Catalog]
; A BDTD não tem sistema de circulação (empréstimo, exemplares)
driver = NoILS

[Mail]
; Sem envio por SMS nem por e-mail de registros e buscas (a produção não oferece)
sms          = disabled
email_action = disabled

[Feedback]
; Formulário de contato (valores da produção)
tab_enabled     = true
recipient_email = "bdtd@ibict.br"
recipient_name  = "BDTD"
email_subject   = "BDTD Contato"
sender_email    = "bdtd@apps.ibict.br"
sender_name     = "BDTD Contato"

[GoogleAnalytics]
; Google Analytics 4 da produção
apiKey = "G-HDE70XCBE2"

[Matomo]
; Estatísticas de uso na LA Referencia, com o identificador OAI, o país e o repositório
; em variáveis personalizadas (Bdtd\View\Helper\Root\Matomo). Desligado até o IBICT
; informar o site_id (na produção ele está vazio e as visitas vão sem site): descomentar
; url e site_id.
;url     = "https://matomo.lareferencia.info/"
;site_id =
country_iso      = BR
custom_variables = true

[Captcha]
; reCAPTCHA em todos os formulários, como na produção. As chaves são do
; ambiente: recaptcha_siteKey e recaptcha_secretKey_file na camada do servidor.
types[]         = recaptcha
forms           = *
recaptcha_theme = light

[Content]
; Teses e dissertações não têm capa: não busca nem exibe imagens de capa
coversize = false

[Languages]
; Só português, como na produção
pt-br = "Brazilian Portugese"

[SearchPlaceholder]
; Texto de exemplo na caixa de busca, como no legado
default = "Pesquise por teses e dissertações"

[Record]
; Sem o botão "Link permanente" na barra do registro (a produção não tem)
permanent_link = false

[Social]
; Recursos sociais desligados, como na produção
comments = disabled
lists    = disabled
tags     = disabled

[System]
; Assistente /Install desligado: não deve ficar aberto ao público.
autoConfigure = false

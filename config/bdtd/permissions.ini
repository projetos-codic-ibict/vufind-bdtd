; BDTD: somente o que difere do permissions.ini padrão do VuFind 11.
[Parent_Config]
relative_path = ../vufind/permissions.ini

; API de busca e registro aberta a todos, como na produção
; (usada por painéis em R/Shiny e por integrações externas)
[api.SearchAndRecord]
permission[] = access.api.Search
permission[] = access.api.Record
require      = ANY
ipRange[]    = "0.0.0.0-255.255.255.255"

; BDTD: somente o que difere do RecordTabs.ini padrão do VuFind 11.
[Parent_Config]
relative_path = ../vufind/RecordTabs.ini
; A lista de abas substitui a do padrão
override_full_sections = "VuFind\RecordDriver\DefaultRecord"

[VuFind\RecordDriver\DefaultRecord]
; Como na produção: só a aba de detalhes técnicos, que começa fechada
tabs[Details] = StaffViewArray
defaultTab    = null

; BDTD: somente o que difere do metadata.ini padrão do VuFind 11.
[Parent_Config]
relative_path = ../vufind/metadata.ini

; Meta tags para indexadores acadêmicos, como na produção
; (HighwirePress é o formato que o Google Acadêmico usa)
[Vocabularies]
Bdtd\RecordDriver\SolrDefault[] = DublinCore
Bdtd\RecordDriver\SolrDefault[] = HighwirePress
